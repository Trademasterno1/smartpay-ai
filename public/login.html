<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101d33">
  <title>Sign in · SmartPay AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:light;--ink:#15243b;--muted:#75839a;--line:#e5ebf3;--blue:#245fe8}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0%,#dce8ff 0,transparent 52%),linear-gradient(180deg,#f3f6fc,#f8fafd);font-family:"DM Sans",sans-serif;color:var(--ink)}
    .card{width:min(100%,430px);padding:36px;background:#fff;border:1px solid #e7edf5;border-radius:22px;box-shadow:0 28px 80px rgba(21,43,76,.12)}
    .brand{display:flex;align-items:center;gap:11px;font:800 23px Manrope,sans-serif;letter-spacing:-1px}
    .mark{display:grid;place-items:center;width:39px;height:39px;border-radius:12px;background:linear-gradient(145deg,#203c66,#122541);color:#fff;font-size:19px}
    .brand em{font-style:normal;color:var(--blue)}
    .eyebrow{margin-top:35px;font-size:10px;letter-spacing:1.6px;font-weight:800;color:#8291a6}
    h1{font:800 27px Manrope,sans-serif;letter-spacing:-1px;margin:8px 0}
    .intro{margin:0 0 25px;color:var(--muted);font-size:13px;line-height:1.7}
    label{display:block;margin:17px 0 7px;font-size:12px;font-weight:700;color:#43536a}
    input{width:100%;height:48px;padding:0 13px;border:1px solid var(--line);border-radius:10px;font:500 14px "DM Sans",sans-serif;color:var(--ink);outline:none}
    input:focus{border-color:#7397f3;box-shadow:0 0 0 3px rgba(36,95,232,.1)}
    button{width:100%;height:50px;margin-top:24px;border:0;border-radius:10px;background:linear-gradient(135deg,#2b67ee,#174bd0);color:#fff;font:700 13px "DM Sans",sans-serif;cursor:pointer;box-shadow:0 8px 18px rgba(36,95,232,.2)}
    button:disabled{opacity:.65;cursor:wait}
    .message{min-height:20px;margin:13px 0 0;font-size:12px;color:#bd3543;line-height:1.5}
    .foot{margin-top:24px;padding-top:18px;border-top:1px solid #edf1f6;color:#8a97a9;font-size:11px;text-align:center}
    @media(max-width:480px){.card{padding:28px 23px}}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand"><span class="mark">S</span><span>smartpay<em>.ai</em></span></div>
    <div class="eyebrow">SECURE WORKSPACE ACCESS</div>
    <h1>Welcome back</h1>
    <p class="intro">Sign in to continue to your SmartPay AI workspace.</p>
    <form id="loginForm" autocomplete="on">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required maxlength="80" placeholder="Enter your username">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="200" placeholder="Enter your password">
      <button id="submitButton" type="submit">Sign in securely</button>
      <p class="message" id="message" role="alert" aria-live="polite"></p>
    </form>
    <div class="foot">Protected access · SmartPay AI</div>
  </main>
  <script>
    const form=document.getElementById("loginForm");
    const button=document.getElementById("submitButton");
    const message=document.getElementById("message");
    form.addEventListener("submit",async event=>{
      event.preventDefault();
      button.disabled=true;button.textContent="Verifying…";message.textContent="";
      try{
        const response=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},credentials:"same-origin",body:JSON.stringify({username:document.getElementById("username").value.trim(),password:document.getElementById("password").value})});
        const data=await response.json().catch(()=>({}));
        if(!response.ok)throw new Error(data.error||"Unable to sign in. Please try again.");
        window.location.replace("/");
      }catch(error){message.textContent=error.message||"Unable to reach SmartPay AI.";}
      finally{button.disabled=false;button.textContent="Sign in securely";}
    });
  </script>
</body>
</html>
